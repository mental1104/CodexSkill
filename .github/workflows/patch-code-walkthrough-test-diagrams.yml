name: Patch code walkthrough test diagrams

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-code-walkthrough-test-diagrams.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strengthen code-driven test and sequence diagram rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("private/note-code-walkthrough/SKILL.md")
          text = path.read_text(encoding="utf-8")

          anchor = "## 5. Test Oracle Rule"
          insertion = '''## 4.1. Pair Test Code With Implementation Code

For every standard or deep representative case, the explanation must be code-driven.

Required sequence:

```text
actual test snippet
→ identify important actions and expectations
→ actual production implementation snippet(s)
→ map each expectation to the line or branch that produces it
→ distinguish target-owned behavior from dependency-owned behavior
→ identify the likely fault location
```

Do not replace this mapping with prose paths, pseudocode, or a coverage table alone.

## 4.2. Model Multi-Participant Tests With Sequence Diagrams

For every standard or deep test case involving two or more runtime participants, endpoints, processes, services, threads, adapters acting as peers, or a harness that simulates another endpoint, include a Mermaid `sequenceDiagram` next to the test code.

Typical participants include:

- local endpoint and remote endpoint;
- client and server;
- application, target component, and peer;
- test process and reference process;
- target component and a loopback/fake-peer harness;
- endpoint, timer/clock, and peer when time is behaviorally significant.

The diagram must:

- use the same names, sequence numbers, flags, windows, states, and timer boundaries as the concrete test;
- show injected events and emitted outputs in their actual order;
- show important intermediate states with `Note over`;
- include silent or missing peer behavior when it triggers timeout/retransmission;
- show negative-oracle boundaries such as no ACK-for-ACK, no double output, or no retransmission before RTO;
- stay adjacent to the corresponding test case, not in a detached diagram appendix.

A flowchart or state diagram does not substitute for a sequence diagram when the test's difficulty comes from interaction order between participants.

'''

          if "## 4.2. Model Multi-Participant Tests With Sequence Diagrams" not in text:
              if anchor not in text:
                  raise RuntimeError("test oracle anchor not found")
              text = text.replace(anchor, insertion + anchor, 1)

          old_template = '''**阶段与状态变化**

**测试预言机**

**实际测试代码**

**覆盖的方法与不变量**'''
          new_template = '''**阶段与状态变化**

**多参与者时序图**（涉及两个及以上参与者时必需）

**测试预言机**

**实际测试代码**

**对应实现代码**

**测试断言如何由实现满足**

**覆盖的方法与不变量**'''
          text = text.replace(old_template, new_template, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit skill and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "private/note-code-walkthrough/SKILL.md"
          git rm ".github/workflows/patch-code-walkthrough-test-diagrams.yml"
          git commit -m "Require sequence diagrams for multi-participant tests"
          git push
