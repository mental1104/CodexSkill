name: Patch code walkthrough test rules

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-code-walkthrough-skill.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strengthen test-to-implementation requirements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("private/note-code-walkthrough/SKILL.md")
          text = path.read_text(encoding="utf-8")

          anchor = "## 5. Test Oracle Rule"
          insertion = '''## 4.1. Pair Test Code With Implementation Code

For every standard or deep representative case, the explanation must be code-driven rather than only descriptive.

Required sequence:

```text
actual test snippet
→ identify each important action and expectation
→ actual production implementation snippet(s)
→ explain which implementation line or branch satisfies each expectation
→ distinguish target-owned behavior from dependency-owned behavior
→ likely fault location if the expectation fails
```

Hard requirements:

- include the real test body or the smallest contiguous excerpt that preserves setup, stimulus, and oracle;
- include the real implementation code that produces the observed result;
- map important `Expect*`, assertion, matcher, state check, timer check, output count, or negative assertion to specific implementation branches;
- when several components cooperate, show the minimal code from each and explain the handoff order;
- do not stop at phrases such as “covers handshake,” “verifies window,” or “tests close semantics”;
- do not replace code-to-code explanation with a coverage table, prose state path, or pseudocode alone;
- keep dependency internals minimal, but include them when the target delegates the decisive state calculation to that dependency.

A test section is incomplete when the reader can understand the expected behavior but still cannot answer:

> Which exact test statements enforce this behavior, and which exact implementation statements make them pass?
'''

          if "## 4.1. Pair Test Code With Implementation Code" not in text:
              text = text.replace(anchor, insertion + "\n\n" + anchor, 1)

          old_template = '''**实际测试代码**

**覆盖的方法与不变量**'''
          new_template = '''**实际测试代码**

**对应实现代码**

**测试断言如何由实现满足**

**覆盖的方法与不变量**'''
          text = text.replace(old_template, new_template, 1)

          checklist_anchor = "- [ ] Important tests explain intent before code."
          checklist_line = "- [ ] Standard/deep cases pair actual test snippets with actual implementation snippets and map assertions to producing branches."
          if checklist_line not in text and checklist_anchor in text:
              text = text.replace(checklist_anchor, checklist_anchor + "\n" + checklist_line, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit skill and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "private/note-code-walkthrough/SKILL.md"
          git rm ".github/workflows/patch-code-walkthrough-skill.yml"
          git commit -m "Require test and implementation code pairing"
          git push
