interface:
  display_name: "PR 对话式审阅"
  short_description: "在 ChatGPT 中逐问逐审 PR，并通过统一网关处理远程操作"
  default_prompt: "Use $github-pr-dialogue-review for conversational pull-request review semantics: bind the review context, answer each question from repository evidence, choose precise anchors, reuse threads, distinguish confirmed defects from questions and suggestions, and prepare focused review payloads. Never invoke GitHub tools or git push directly. Request all remote PR metadata, diffs, threads, comments, replies, formal review states, and other GitHub reads/writes through $github-operations, which owns target verification and execution."

policy:
  allow_implicit_invocation: true
