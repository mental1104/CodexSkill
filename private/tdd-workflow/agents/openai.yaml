interface:
  display_name: "TDD Workflow"
  short_description: "跨语言 TDD 阶段门禁、集成测试场景评审与显式确认流程"
  default_prompt: "Use $tdd-workflow for explicit TDD or reviewed test-first work. Follow SKILL.md as the source of truth for the five phases: Black-box Contract, Integration Scenario Review, Integration Test Implementation, Production Implementation, and Unit Test. Produce only artifacts allowed by the current phase and stop for the required review; passing checks do not approve unseen work. Integration tests must express the complete approved behavior through the agreed public and fixture boundaries, with natural failures rather than artificial RED markers. Compose applicable language and comment skills without crossing the phase gate."

policy:
  allow_implicit_invocation: true
