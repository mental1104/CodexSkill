interface:
  display_name: "Blue Espeon Notes"
  short_description: "Vault conventions for routed technical notes"
  default_prompt: "For any request to create, archive, or materially restructure an Obsidian note, use $ROUTER first to select the primary note-writing skill and enforce its pre-write outline approval gate. Use $blue-espeon-note-style only as a convention helper: before deciding directory placement, read and apply private/blue-espeon-note-style/references/source-and-topic-directory-policy.md; choose placement, naming, wikilinks, backlinks, visualization and split boundaries. Do not write the note directly or bypass the selected primary note skill. For style-only questions, use this skill as needed."

policy:
  allow_implicit_invocation: true
