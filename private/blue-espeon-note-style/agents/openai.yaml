interface:
  display_name: "Blue Espeon Notes"
  short_description: "Write and place technical notes in the established vault style"
  default_prompt: "Use $blue-espeon-note-style to create or revise a technical Obsidian note in this vault. Before deciding directory placement, read and apply private/blue-espeon-note-style/references/source-and-topic-directory-policy.md. Choose the best existing vault directory for reusable topic notes, preserve source-oriented reading notes in their source tree, split Q&A-derived material into single-thesis notes instead of aggregate topic notes, add backlinks, include diagrams when useful, and produce stepwise library tutorial notes with compile-ready examples and build/run outputs when relevant."

policy:
  allow_implicit_invocation: true
