interface:
  display_name: "终端输出解构"
  short_description: "将终端交互按五级主题、六级操作分组，输出可复制 Markdown 源码和行号概要"
  default_prompt: "使用 $terminal-output-deconstruct 解构一下下面的终端交互记录：按执行顺序，以概括性五级标题对相关六级目的小节分组，每个小节保留命令块和对应输出，短记录按需分组；Linux、macOS、Git Bash 使用 sh，Windows PowerShell 使用 powershell；每个非空输出块后附简短概要，并标注块内行号及关键字段；整篇放在外层四反引号的 markdown 代码块中，保留内部围栏和语言标识，内部围栏更长时相应加长外层。"

policy:
  allow_implicit_invocation: true
