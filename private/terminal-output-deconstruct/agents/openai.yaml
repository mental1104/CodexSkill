interface:
  display_name: "终端输出解构"
  short_description: "将终端交互按五级主题、六级操作分组，输出可复制 Markdown 源码和行号概要"
  default_prompt: "使用 $terminal-output-deconstruct 解构以下终端记录：按原顺序以五级主题组织六级操作，配对命令和输出并附行号概要；普通 JSON（含混合日志中的 JSON）使用 4 空格缩进，JSONL 保持原格式；命令中的紧凑 JSON 原样保留，命令块后紧跟格式化 json 展示块，再展示输出；Linux、macOS、Git Bash 使用 sh，Windows PowerShell 使用 powershell；整篇放入外层至少四反引号的 markdown 源码块，内部围栏更长时相应加长外层。"

policy:
  allow_implicit_invocation: true
