interface:
  display_name: "C++ Code Style"
  short_description: "应用个人 C++ 强类型、所有权、RAII 与显式状态变化规范"
  default_prompt: "Use $cpp-code-style whenever creating or modifying C++ code and apply $code-comment-writing as its mandatory companion. Treat the full skill as binding, not advisory. Prefer compile-time guarantees, strongly typed domain models, const-correct and ownership-explicit interfaces, RAII-managed lifetimes, value semantics, explicit error contracts, and visible state transitions. Avoid unnecessary output parameters, shared ownership, runtime type erasure, stringly-typed APIs, and speculative abstraction. Do not invent overloads, implicit compatibility inputs, aliases, fallbacks, extra public APIs, or stricter business validation unless required by the user, protocol, existing public API/ABI, or an explicit migration plan. When common infrastructure is needed, inspect the repository's existing implementation and mental1104/common before reinventing it, but do not create hidden build dependencies. Do not treat compilation, tests, formatting, clang-tidy, or static analysis as completion: before returning, re-read the full $cpp-code-style mandatory gates and delivery checklist and revise any violations."

policy:
  allow_implicit_invocation: true
