interface:
  display_name: "Python Code Style"
  short_description: "应用个人 Python 静态类型、数据建模与显式状态变化规范"
  default_prompt: "Use $python-code-style whenever creating or modifying Python code and apply $code-comment-writing as its mandatory companion. Prefer static-analysis-first APIs, fully convert external JSON or dictionary-shaped data into validated typed models at system boundaries, preserve concrete type relationships, do not add runtime registration/plugin APIs unless explicitly required, group related private implementation helpers by responsibility, keep one canonical name per concept, avoid hidden argument mutation, and make important state transitions visible at the call site."

policy:
  allow_implicit_invocation: true
