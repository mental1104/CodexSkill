interface:
  display_name: "Python Code Style"
  short_description: "应用个人 Python 静态类型、声明式建模与显式状态变化规范"
  default_prompt: "Use $python-code-style whenever creating or modifying Python code and apply $code-comment-writing as its mandatory companion. When $tdd-workflow is active, obey its current phase gate before this skill and apply Python style only to artifacts allowed in the current phase; never generate later-phase code merely because this skill describes how to write it. Treat the full skill as binding, not advisory. Before coding, prefer static-analysis-first APIs and fully convert external JSON/dictionary-shaped data into validated typed models. For stable external schemas, prefer the repository's existing declarative model system; when Pydantic is already available and appropriate, prefer BaseModel/Field/validators/discriminated unions instead of handwritten schema engines. Keep schema fields as one source of truth: do not duplicate them in _LOCAL_FIELDS/_REMOTE_FIELDS sets, required tuples, or check_schema helpers. Use Enum/StrEnum or another typed representation for stable finite modes instead of scattered string literals. Do not invent compatibility inputs, aliases, fallbacks, or extra public APIs. Prefer one typed error plus an error code unless callers truly need distinct exception classes. Runtime-visible logs, exceptions, CLI/stdout/stderr, assertions, and diagnostics must use ASCII English. Group related private implementation by responsibility; when several helpers form one parsing/validation/construction responsibility chain, prefer a clearly named private class instead of module-level helper families such as _decode_*/_read_*/_validate_*/_required_*. If mode-specific parsing/validation/construction behavior becomes independently non-trivial or grows with each mode, prefer strategy/polymorphism over an expanding central if/elif; do not force a strategy hierarchy for trivial dispatch. For pytest, when multiple tests target the same public API, class, component, or behavior area, group them under a clearly named TestXxx class instead of leaving a long flat list of module-level test_* functions; use the class only for organization, without inventing shared mutable state, inheritance, or setup complexity. Organize each module in reverse call-topological order: callees and lower-level private implementation first, higher-level callers later, public facade/entry near the bottom, and __all__ last. Do not place the public entry above helpers it calls. Do not treat tests, formatting, or type checking as completion: before returning, re-read the full $python-code-style delivery checklist and revise any violations."

policy:
  allow_implicit_invocation: true
