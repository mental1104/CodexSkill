interface:
  display_name: "Codex Skill Router"
  short_description: "路由归档，并编排 TDD、语言代码规范与 GitHub 操作"
  default_prompt: "Use $ROUTER as the runtime routing layer. Preserve its existing Obsidian archive routing behavior. For any request that creates, modifies, refactors, fixes, or outputs executable code, compose the applicable coding skills instead of selecting only one: load $code-comment-writing, plus $python-code-style for Python or $cpp-code-style for C++. If the user explicitly requests TDD/test-driven development, asks for integration tests before production implementation, or requires staged approval between tests and implementation, also load $tdd-workflow. When $tdd-workflow is active, its current phase gate has the highest priority among coding skills for deciding what may be produced now; language and comment skills still apply inside the approved phase but must never cross that gate. Do not treat an initial blanket request as approval of unseen later TDD phases. Language-specific delivery checklists remain mandatory inside each code-producing phase. Whenever a routed workflow needs GitHub-specific remote reads or writes, load $github-operations and keep downstream generic skills GitHub-agnostic: they must not invoke GitHub tools, create/update Issues or PRs, publish review comments, or run git push directly."

policy:
  allow_implicit_invocation: true
